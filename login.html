<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>24 – Sign In</title>
    <meta name="description" content="Sign in or register for Project 24 via email OTP verification.">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <meta name="theme-color" content="#050505">
    <!-- Theme Engine & Auth Client -->
    <script src="theme-manager.js"></script>
    <script src="storage-service.js"></script>
    <script src="auth-client.js"></script>
</head>
<body class="auth-page">
    <main>
        <header>
            <div class="logo">24</div>
        </header>

        <section class="auth-card-container">
            <div class="subtitle">AUTHENTICATION</div>
            <h1 class="page-heading" id="authTitle">Sign In to 24</h1>
            <p class="auth-desc" id="authSubtitle">Enter your email address to receive a secure one-time verification code.</p>

            <!-- Alert Box for feedback, errors, and session conflicts -->
            <div id="authAlert" class="auth-alert" style="display: none;"></div>

            <!-- STEP 1: Enter Email -->
            <form id="emailForm" class="auth-form">
                <div class="form-field">
                    <label class="form-label" for="emailInput">Email Address</label>
                    <input type="email" id="emailInput" class="form-input" placeholder="you@example.com" required autocomplete="email" autofocus />
                </div>
                <button type="submit" class="btn-submit-auth" id="sendOtpBtn">
                    Send Verification Code
                </button>
            </form>

            <!-- STEP 2: Enter OTP (Hidden initially) -->
            <form id="otpForm" class="auth-form" style="display: none;">
                <div class="form-field">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label class="form-label" for="otpInput">One-Time Code (6 Digits)</label>
                        <button type="button" id="changeEmailBtn" class="btn-link" style="font-size: 11px;">Change email</button>
                    </div>
                    <input type="text" id="otpInput" class="form-input" placeholder="••••••" maxlength="6" inputmode="numeric" pattern="[0-9]*" required autocomplete="one-time-code" style="letter-spacing: 8px; font-size: 20px; text-align: center;" />
                </div>

                <div class="otp-resend-row">
                    <span id="resendCountdownText" style="font-size: 12px; color: var(--text-secondary);">Resend code in <strong id="resendTimer">60</strong>s</span>
                    <button type="button" id="resendOtpBtn" class="btn-link" style="display: none; font-size: 12px;">Resend Code</button>
                </div>

                <button type="submit" class="btn-submit-auth" id="verifyOtpBtn">
                    Verify & Continue
                </button>
            </form>

            <div class="auth-footer-note">
                <p>New users are automatically registered upon verification.</p>
                <p style="margin-top: 4px; font-size: 11px; color: var(--text-secondary);">One active session per account is permitted at a time.</p>
            </div>
        </section>

        <footer>
            <p>You don't have 24 hours.</p>
            <p>You have what's left.</p>
        </footer>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // If already authenticated and session valid, redirect directly
            if (window.AuthClient && window.AuthClient.isAuthenticated()) {
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect') || 'index.html';
                window.location.replace(redirect);
                return;
            }

            const emailForm = document.getElementById('emailForm');
            const otpForm = document.getElementById('otpForm');
            const emailInput = document.getElementById('emailInput');
            const otpInput = document.getElementById('otpInput');
            const sendOtpBtn = document.getElementById('sendOtpBtn');
            const verifyOtpBtn = document.getElementById('verifyOtpBtn');
            const authTitle = document.getElementById('authTitle');
            const authSubtitle = document.getElementById('authSubtitle');
            const authAlert = document.getElementById('authAlert');
            const changeEmailBtn = document.getElementById('changeEmailBtn');
            const resendCountdownText = document.getElementById('resendCountdownText');
            const resendTimer = document.getElementById('resendTimer');
            const resendOtpBtn = document.getElementById('resendOtpBtn');

            let currentEmail = '';
            let timerInterval = null;

            // Check if reason query param exists
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('reason') === 'session_expired') {
                showAlert('Your session has expired or another device was logged in. Please sign in again.', 'warning');
            }

            function showAlert(msg, type = 'error') {
                authAlert.textContent = msg;
                authAlert.style.display = 'block';
                authAlert.className = `auth-alert ${type}`;
            }

            function hideAlert() {
                authAlert.style.display = 'none';
            }

            function startResendCountdown(seconds = 60) {
                if (timerInterval) clearInterval(timerInterval);
                resendCountdownText.style.display = 'inline';
                resendOtpBtn.style.display = 'none';
                resendTimer.textContent = seconds;

                timerInterval = setInterval(() => {
                    seconds--;
                    resendTimer.textContent = seconds;
                    if (seconds <= 0) {
                        clearInterval(timerInterval);
                        resendCountdownText.style.display = 'none';
                        resendOtpBtn.style.display = 'inline';
                    }
                }, 1000);
            }

            // Step 1: Send OTP
            emailForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert();
                const email = emailInput.value.trim().toLowerCase();
                if (!email) return;

                sendOtpBtn.disabled = true;
                sendOtpBtn.textContent = 'Sending Code...';

                try {
                    await window.AuthClient.sendOtp(email);
                    currentEmail = email;

                    // Transition to OTP step
                    emailForm.style.display = 'none';
                    otpForm.style.display = 'flex';
                    authTitle.textContent = 'Enter Verification Code';
                    authSubtitle.textContent = `A 6-digit code was sent to ${email}`;
                    otpInput.value = '';
                    otpInput.focus();

                    startResendCountdown(60);
                } catch (err) {
                    if (err.conflict) {
                        showAlert('This account is currently active on another device. Project 24 allows only one active device session at a time. Please log out from your other device first.', 'error');
                    } else {
                        showAlert(err.message || 'Failed to send code', 'error');
                    }
                } finally {
                    sendOtpBtn.disabled = false;
                    sendOtpBtn.textContent = 'Send Verification Code';
                }
            });

            // Resend OTP
            resendOtpBtn.addEventListener('click', async () => {
                hideAlert();
                resendOtpBtn.disabled = true;
                resendOtpBtn.textContent = 'Resending...';

                try {
                    await window.AuthClient.sendOtp(currentEmail);
                    showAlert(`A new verification code has been sent to ${currentEmail}`, 'success');
                    startResendCountdown(60);
                } catch (err) {
                    showAlert(err.message || 'Failed to resend code', 'error');
                } finally {
                    resendOtpBtn.disabled = false;
                    resendOtpBtn.textContent = 'Resend Code';
                }
            });

            // Change Email button
            changeEmailBtn.addEventListener('click', () => {
                hideAlert();
                if (timerInterval) clearInterval(timerInterval);
                otpForm.style.display = 'none';
                emailForm.style.display = 'flex';
                authTitle.textContent = 'Sign In to 24';
                authSubtitle.textContent = 'Enter your email address to receive a secure one-time verification code.';
                emailInput.focus();
            });

            // Step 2: Verify OTP
            otpForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert();
                const otp = otpInput.value.trim();
                if (!otp || otp.length < 6) {
                    showAlert('Please enter the complete 6-digit verification code', 'error');
                    return;
                }

                verifyOtpBtn.disabled = true;
                verifyOtpBtn.textContent = 'Verifying...';

                try {
                    const result = await window.AuthClient.verifyOtp(currentEmail, otp);
                    showAlert('Verification successful! Entering 24...', 'success');

                    setTimeout(() => {
                        const redirect = urlParams.get('redirect') || 'index.html';
                        window.location.replace(redirect);
                    }, 800);
                } catch (err) {
                    if (err.conflict) {
                        showAlert('Login blocked: This account is currently active on another device. Please log out from that device first.', 'error');
                    } else {
                        showAlert(err.message || 'Invalid or expired verification code', 'error');
                    }
                    verifyOtpBtn.disabled = false;
                    verifyOtpBtn.textContent = 'Verify & Continue';
                }
            });
        });
    </script>
</body>
</html>
